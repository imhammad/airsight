name: airsight

# Settings every backend container shares (the API, the worker and the scheduler)
x-backend: &backend
  build:
    context: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://airsight:airsight@db:5432/airsight
    REDIS_URL: redis://redis:6379/0
  # API keys come from .env on your machine. CI has no .env, so it's optional.
  env_file:
    - path: .env
      required: false
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *backend
    # One task at a time: runs are short, and the database lock stops overlaps anyway
    command: ["celery", "-A", "airsight.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A airsight.worker.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  beat:
    <<: *backend
    # Beat remembers when each job last ran in a small file; /tmp is writable for the app user
    command: ["celery", "-A", "airsight.worker.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    # The image's healthcheck calls the API, which doesn't run here
    healthcheck:
      disable: true

  db:
    image: timescale/timescaledb-ha:pg17
    environment:
      # Local development only. Production credentials come from secrets (Phase 10).
      POSTGRES_USER: airsight
      POSTGRES_PASSWORD: airsight
      POSTGRES_DB: airsight
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airsight -d airsight"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
