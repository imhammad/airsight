# Production on the Mac (ADR 0014), next to docker-compose.yml. Always run it as:
#
#   scripts/deploy.sh <vX.Y.Z | main> <commit sha>
#
# which GitHub Actions runs on a release (issue #166), or the prod command on the Mac for
# everything else (prod ps, prod logs -f api). Production runs only images CI built and
# pushed to GHCR, tagged with the commit sha; it never builds anything itself.
#
# It is its own Compose project, airsight-prod, with its own volumes, so development can never
# touch production data. Only the web service is published, on 127.0.0.1:8080, where Tailscale
# Funnel picks it up. The internal tools listen on 127.0.0.1 on ports that don't clash with
# development. Secrets come from .env.prod, which is never committed (see .env.prod.example).
name: airsight-prod

x-prod-backend: &prod-backend
  image: ghcr.io/imhammad/airsight-backend:${AIRSIGHT_IMAGE_TAG:?run through scripts/deploy.sh or the prod command}
  build: !reset null
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql+psycopg://airsight:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@db:5432/airsight
    REDIS_URL: redis://redis:6379/0
    MLFLOW_TRACKING_URI: http://mlflow:5000
    RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}

services:
  web:
    image: ghcr.io/imhammad/airsight-web:${AIRSIGHT_IMAGE_TAG:?run through scripts/deploy.sh or the prod command}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m

  api:
    <<: *prod-backend
    # Behind Caddy, the visitor's address arrives in X-Forwarded-For. Uvicorn uses it, so the
    # rate limit counts each visitor, not Caddy. Only Caddy can reach the API in production.
    command: ["uvicorn", "airsight.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    <<: *prod-backend
    deploy:
      resources:
        limits:
          memory: 2g

  beat:
    <<: *prod-backend
    deploy:
      resources:
        limits:
          memory: 512m

  exporter:
    <<: *prod-backend
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 512m

  mlflow:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:5002:5000"
    deploy:
      resources:
        limits:
          memory: 2g

  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    restart: unless-stopped
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 256m

  prometheus:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:9091:9090"
    deploy:
      resources:
        limits:
          memory: 512m

  alertmanager:
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env.prod}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID in .env.prod}
    # Alertmanager can't read environment variables in its config, so fill the placeholders in
    # alertmanager.prod.yml into a copy in /tmp, then start it on that copy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed -e "s|telegram-bot-token|$$TELEGRAM_BOT_TOKEN|" -e "s|chat_id: 0$$|chat_id: $$TELEGRAM_CHAT_ID|"
        /etc/alertmanager/alertmanager.prod.yml > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    ports: !override
      - "127.0.0.1:9094:9093"
    deploy:
      resources:
        limits:
          memory: 128m

  grafana:
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env.prod}
    ports: !override
      - "127.0.0.1:3001:3000"
    deploy:
      resources:
        limits:
          memory: 512m

  # Nightly database backups into iCloud Drive, so a lost or broken Mac doesn't lose the data
  # (issue #167). Same image as the database, so pg_dump always matches the server. The script
  # and the restore check are in infra/backup/; how to restore is in docs/RUNBOOK.md.
  backup:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    entrypoint: ["/opt/backup/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: airsight
      PGDATABASE: airsight
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      # The image's own PATH, plus the scripts, so "prod exec backup restore.sh" works
      PATH: /opt/backup:/usr/lib/postgresql/17/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ./infra/backup:/opt/backup:ro
      - ${BACKUP_DIR:?set BACKUP_DIR in .env.prod}:/backups
    depends_on:
      db:
        condition: service_healthy
    # Healthy while the newest backup is under 26 hours old (one day plus time to catch up)
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'airsight-*.dump' -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      start_period: 10m
      start_interval: 15s
      retries: 1
    deploy:
      resources:
        limits:
          memory: 256m
