name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the code
permissions:
  contents: read

# A new push to the same PR cancels the older, now pointless run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Run pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies exactly as locked
        run: uv sync --locked
      - name: Start the database
        run: docker compose -f ../docker-compose.yml up -d --wait db
      - name: Run tests
        run: uv run pytest

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the alert rules
        run: >
          docker run --rm -v "$PWD/infra/prometheus:/p:ro" --entrypoint promtool
          prom/prometheus:v3.16.0 test rules /p/tests/airsight_test.yml
      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --build --wait
      - name: Call the health endpoint
        run: curl --fail --silent --show-error localhost:8000/v1/health
      - name: Read the exporter's metrics
        run: curl --fail --silent --show-error localhost:9108/metrics | grep '^airsight_exporter_up'
      - name: Check that Prometheus scrapes the API and the exporter
        # Prometheus scrapes every 15 seconds, so give it a moment after start
        run: |
          for attempt in $(seq 12); do
            up=$(curl --silent -G localhost:9090/api/v1/query --data-urlencode 'query=sum(up{job=~"api|exporter"})' | jq -r '.data.result[0].value[1]')
            [ "$up" = "2" ] && echo "Both targets up" && exit 0
            sleep 5
          done
          echo "Prometheus does not see both targets up"; exit 1
      - name: Check that Grafana loaded the three dashboards
        run: |
          count=$(curl --fail --silent 'localhost:3000/api/search?tag=airsight' | jq length)
          echo "$count dashboards"; [ "$count" = "3" ]
      - name: Show logs
        if: always()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies exactly as locked
        run: npm ci
      - name: No known vulnerabilities in production dependencies
        run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies exactly as locked
        run: npm ci
      - name: Install Chromium for Playwright and Lighthouse
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests on a phone and a laptop (builds the app)
        run: npm run e2e
      - name: Lighthouse on the same build
        run: npm run lighthouse
      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-reports
          path: |
            web/playwright-report
            web/.lighthouseci
          retention-days: 14
