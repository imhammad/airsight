name: Images and deploy

# Every push to main builds and publishes the images to GHCR. A release tag (vX.Y.Z) also
# deploys that release to production on the Mac (ADR 0014, issue #166). Run it by hand from
# the Actions tab to test a deploy of main. A pull request that changes how the images are
# built only builds them, so a broken image never reaches main.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - backend/Dockerfile
      - backend/.dockerignore
      - backend/pyproject.toml
      - backend/uv.lock
      - web/Dockerfile
      - web/.dockerignore
      - web/package-lock.json
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: airsight-backend
            context: backend
          - image: airsight-web
            context: web
    steps:
      - uses: actions/checkout@v7
      # Build for Intel and Apple Silicon: the Mac in production is arm64
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # sha-<full commit> is what production runs; the others are for people
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to production
    needs: images
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The secrets live in this environment, and the repo's Deployments list shows each deploy
    environment:
      name: production
      url: https://airsight.tailbcc5c4.ts.net
    # One deploy at a time, and never cancel one halfway through
    concurrency:
      group: production
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      DEPLOY_HOST: airsight.tailbcc5c4.ts.net
    steps:
      # Join the tailnet as a short-lived tag:ci machine, which may only reach the Mac's SSH port
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.DEPLOY_HOST }}
      - name: Set up the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # The key can only run scripts/deploy.sh, which takes the version and the exact commit
      - name: Deploy ${{ github.ref_name }}
        run: >-
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o ServerAliveInterval=30 "hammadhassan@$DEPLOY_HOST"
          "$GITHUB_REF_NAME" "$GITHUB_SHA"
      # The check a visitor makes, through Funnel and Caddy. Public DNS, so it doesn't take the
      # tailnet path (which tag:ci may not use for anything but SSH).
      - name: Check the public site
        run: >-
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5
          --doh-url https://1.1.1.1/dns-query "https://$DEPLOY_HOST/v1/health"
