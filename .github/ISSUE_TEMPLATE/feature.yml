name: Feature or task
description: Plan a new capability or a piece of work
labels: ["type:feature"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why does this matter? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: What to do
      description: The concrete work, as a short list.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we know it's done. Every line must be checkable.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, open questions, tradeoffs.
