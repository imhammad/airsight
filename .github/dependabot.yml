version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["type:chore", "area:api"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels: ["type:chore", "area:infra"]

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["type:chore", "area:infra"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["type:chore", "area:web"]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (engineering log, 2026-11-02)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Type definitions must match the Node.js major version in web/.nvmrc
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
