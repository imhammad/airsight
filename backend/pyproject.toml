[project]
name = "airsight"
version = "0.5.0"
description = "AirSight backend: ingestion, ML and API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "celery[redis]>=5.6.3",
    "fastapi>=0.162.0",
    "geoalchemy2>=0.20.0",
    "httpx2>=2.16.0",
    "lightgbm>=4.7.0",
    "mlflow-skinny>=3.18.0",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.7",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airsight"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
notebooks = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
]
