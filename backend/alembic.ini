# Used by the alembic command line, for example: uv run alembic revision -m "add forecasts"
# The database URL comes from airsight.core.config (DATABASE_URL), not from this file.
[alembic]
script_location = %(here)s/src/airsight/migrations
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
