# Prometheus scrapes the API and the exporter and keeps the numbers for 30 days (ADR 0013).
# Every target is a compose service name, so this file works unchanged inside compose.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules and their unit tests live next to this file (rules/, tests/)
rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Requests, errors and latency, from the API process itself
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  # Data freshness, job runs, the queue and live accuracy, read from the database
  - job_name: exporter
    static_configs:
      - targets: ["exporter:9108"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
