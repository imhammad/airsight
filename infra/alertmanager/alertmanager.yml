# Development: firing alerts only show on Alertmanager's page (localhost:9093) and in Grafana.
# Production uses alertmanager.prod.yml, which sends them to Telegram.
route:
  receiver: nobody
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: nobody
